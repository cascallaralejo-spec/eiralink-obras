<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EiraLink Obras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#F3F6F3; --surface:#FFFFFF; --surface2:#EAF0EB; --ink:#182119; --muted:#5D6B60;
  --line:#DCE4DC; --brand:#2E9E5B; --brand-deep:#20713F; --brand-soft:#E2F2E7;
  --amber:#A96C0E; --amber-soft:#FBF0DA; --danger:#BA4A33; --danger-soft:#F9E8E3;
  --shadow:0 1px 3px rgba(24,33,25,.08),0 4px 16px rgba(24,33,25,.06);
  --mention:#20713F; --mention-bg:#E2F2E7;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1411; --surface:#171E18; --surface2:#202A21; --ink:#E8EFE8; --muted:#98A69A;
    --line:#2A342B; --brand:#4CBE7C; --brand-deep:#6FD198; --brand-soft:#1D3325;
    --amber:#E0A44A; --amber-soft:#31270E; --danger:#E07B63; --danger-soft:#3A1F17;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    --mention:#6FD198; --mention-bg:#1D3325;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E18; --surface2:#202A21; --ink:#E8EFE8; --muted:#98A69A;
  --line:#2A342B; --brand:#4CBE7C; --brand-deep:#6FD198; --brand-soft:#1D3325;
  --amber:#E0A44A; --amber-soft:#31270E; --danger:#E07B63; --danger-soft:#3A1F17;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --mention:#6FD198; --mention-bg:#1D3325;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Barlow Semi Condensed','Barlow',sans-serif; text-wrap:balance; margin:0}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit; padding:0}
textarea,input,select{font-family:inherit; font-size:16px; color:var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:720px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  display:flex; align-items:center; gap:10px; padding:12px 16px 10px;
  border-bottom:1px solid var(--line);
}
.logo{display:flex; align-items:center; gap:8px; min-width:0}
.logo svg{display:block}
.logo .lg-icon{fill:var(--brand)}
.logo .lg-text{fill:var(--ink)}
.top-spacer{flex:1}
.iconbtn{
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--line); position:relative; flex:none;
}
.iconbtn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.badge{
  position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 4px;
  border-radius:9px; background:var(--danger); color:#fff; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
}
.userchip{
  display:flex; align-items:center; gap:6px; height:40px; padding:0 12px 0 6px; border-radius:12px;
  background:var(--surface); border:1px solid var(--line); font-weight:600; max-width:150px; flex:none;
}
.avatar{
  width:28px; height:28px; border-radius:9px; background:var(--brand); color:#fff;
  font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex:none;
  font-family:'Barlow Semi Condensed',sans-serif;
}
.userchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px}

main{flex:1; padding:16px; display:flex; flex-direction:column; gap:14px}
main.has-composer{padding-bottom:150px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow)}
.section-title{
  font-family:'Barlow Semi Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; margin-top:4px;
}
.section-title .count{
  background:var(--surface2); border-radius:8px; padding:1px 7px; font-size:12px; color:var(--ink);
  font-variant-numeric:tabular-nums;
}

/* ---------- setup ---------- */
.setup{display:flex; flex-direction:column; align-items:center; gap:18px; padding:48px 24px; text-align:center}
.setup h1{font-size:26px; font-weight:700}
.setup p{color:var(--muted); margin:0; max-width:38ch}
.namegrid{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:480px}
.namegrid button{
  display:flex; align-items:center; gap:8px; padding:10px 16px 10px 10px; border-radius:14px;
  background:var(--surface); border:1px solid var(--line); font-weight:600; box-shadow:var(--shadow);
}
.addname{display:flex; gap:8px; width:100%; max-width:340px}
.addname input{
  flex:1; padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); min-width:0;
}
.addname button{
  padding:0 18px; border-radius:12px; background:var(--brand); color:#fff; font-weight:700; flex:none;
}

/* ---------- home ---------- */
.obra-card{padding:14px 16px; display:flex; flex-direction:column; gap:8px; cursor:pointer}
.obra-card .row1{display:flex; align-items:baseline; gap:10px}
.obra-card h3{font-size:19px; font-weight:700; flex:1; min-width:0}
.obra-card .cliente{color:var(--muted); font-size:14px}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chip{
  font-size:13px; font-weight:600; padding:3px 10px; border-radius:99px;
  background:var(--surface2); color:var(--muted); font-variant-numeric:tabular-nums;
}
.chip.pend{background:var(--amber-soft); color:var(--amber)}
.chip.ok{background:var(--brand-soft); color:var(--brand-deep)}
.chip.fin{background:var(--surface2); color:var(--muted)}
.bigbtn{
  display:flex; align-items:center; justify-content:center; gap:8px; padding:14px;
  border-radius:16px; background:var(--brand); color:#fff; font-weight:700; font-size:16px;
  box-shadow:var(--shadow);
}
.bigbtn svg{width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round}
.empty{padding:28px 20px; text-align:center; color:var(--muted)}
.linklike{color:var(--brand-deep); font-weight:600}

/* ---------- obra view ---------- */
.obra-head{display:flex; align-items:center; gap:10px}
.obra-head h2{font-size:22px; font-weight:700; flex:1; min-width:0; line-height:1.2}
.backbtn{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.backbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.botonera{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px}
.botonera button{
  display:flex; align-items:center; gap:7px; padding:9px 14px; border-radius:12px; flex:none;
  background:var(--surface); border:1px solid var(--line); font-weight:600; font-size:14px;
}
.botonera svg{width:16px; height:16px; stroke:var(--brand-deep); fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.minuta-card{padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.minuta-card .mhead{display:flex; align-items:center; gap:8px}
.minuta-card .mhead h3{flex:1; font-size:17px}
.minuta-text{white-space:pre-wrap; overflow-wrap:break-word}
.minuta-text.placeholder{color:var(--muted)}
.meta{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.editbtn{font-size:14px; font-weight:600; color:var(--brand-deep); padding:4px 8px; border-radius:8px; background:var(--brand-soft)}

.item{padding:12px 14px; display:flex; gap:10px; align-items:flex-start}
.item + .item{border-top:1px solid var(--line)}
.checkbox{
  width:24px; height:24px; border-radius:8px; border:2px solid var(--line); flex:none; margin-top:2px;
  display:flex; align-items:center; justify-content:center; background:var(--surface);
}
.checkbox.done{background:var(--brand); border-color:var(--brand)}
.checkbox svg{width:14px; height:14px; stroke:#fff; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.item-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.item-text{overflow-wrap:break-word}
.item.done-item .item-text{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line)}
.item-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.resp{background:var(--amber-soft); color:var(--amber); font-weight:600; padding:1px 8px; border-radius:99px; font-size:12px}
.mention{background:var(--mention-bg); color:var(--mention); font-weight:600; padding:0 4px; border-radius:5px}
.thread-toggle{font-size:13px; font-weight:600; color:var(--brand-deep); align-self:flex-start}
.thread{display:flex; flex-direction:column; gap:8px; border-left:2px solid var(--line); padding-left:10px; margin-top:2px}
.thread .titem{font-size:14px}
.thread .titem .item-meta{font-size:12px}
.thread-input{display:flex; gap:6px}
.thread-input input{flex:1; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); min-width:0; font-size:14px}
.thread-input button{padding:0 12px; border-radius:10px; background:var(--brand); color:#fff; font-weight:700; font-size:13px; flex:none}
.collapse-head{width:100%; text-align:left; padding:12px 14px; display:flex; align-items:center; gap:8px; font-weight:600; color:var(--muted)}
.collapse-head .count{background:var(--surface2); border-radius:8px; padding:1px 7px; font-size:12px}
.caret{margin-left:auto; transition:transform .15s}
.caret.open{transform:rotate(180deg)}

/* ---------- composer ---------- */
.composer{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}
.composer-inner{max-width:696px; margin:0 auto; display:flex; flex-direction:column; gap:8px}
.tipo-toggle{display:flex; gap:6px}
.tipo-toggle button{
  padding:5px 14px; border-radius:99px; font-size:13px; font-weight:700; border:1px solid var(--line);
  background:var(--bg); color:var(--muted);
}
.tipo-toggle button.active{background:var(--brand-soft); color:var(--brand-deep); border-color:var(--brand)}
.resp-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.resp-row select{padding:5px 8px; border-radius:9px; border:1px solid var(--line); background:var(--bg); font-size:13px}
.compose-row{display:flex; gap:8px; align-items:flex-end}
.compose-row textarea{
  flex:1; resize:none; min-height:44px; max-height:120px; padding:10px 12px;
  border-radius:12px; border:1px solid var(--line); background:var(--bg); line-height:1.35;
}
.micbtn,.sendbtn,.atbtn{
  width:44px; height:44px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center;
}
.atbtn{background:var(--bg); border:1px solid var(--line); font-weight:700; font-size:18px; color:var(--muted)}
.micbtn{background:var(--bg); border:1px solid var(--line)}
.micbtn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.micbtn.rec{background:var(--danger); border-color:var(--danger); animation:pulse 1.2s infinite}
.micbtn.rec svg{stroke:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(186,74,51,.4)}50%{box-shadow:0 0 0 8px rgba(186,74,51,0)}}
.sendbtn{background:var(--brand)}
.sendbtn svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.fotobtn{width:44px; height:44px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--bg); border:1px solid var(--line)}
.fotobtn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.foto-strip{display:none; gap:8px; flex-wrap:wrap}
.foto-strip.has{display:flex}
.foto-chip{position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; border:1px solid var(--line)}
.foto-chip img{width:100%; height:100%; object-fit:cover; display:block}
.foto-chip button{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; background:rgba(10,16,11,.7); color:#fff; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center}
.item-fotos{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px}
.item-fotos img{width:96px; height:96px; object-fit:cover; border-radius:10px; border:1px solid var(--line); cursor:pointer; background:var(--surface2)}
.lightbox{position:fixed; inset:0; z-index:90; background:rgba(5,10,6,.92); display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out}
.lightbox img{max-width:100%; max-height:92vh; border-radius:12px}
.mention-bar{display:none; flex-wrap:wrap; gap:6px}
.mention-bar.open{display:flex}
.mention-bar button{
  font-size:13px; font-weight:600; padding:5px 11px; border-radius:99px;
  background:var(--mention-bg); color:var(--mention);
}

/* ---------- modals ---------- */
.overlay{
  position:fixed; inset:0; z-index:50; background:rgba(10,16,11,.45);
  display:flex; align-items:flex-end; justify-content:center;
}
@media(min-width:560px){.overlay{align-items:center; padding:24px}}
.sheet{
  background:var(--surface); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:14px;
}
@media(min-width:560px){.sheet{border-radius:20px}}
.sheet-head{display:flex; align-items:center; gap:10px}
.sheet-head h3{font-size:19px; flex:1}
.closebtn{width:34px; height:34px; border-radius:10px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:17px; color:var(--muted); flex:none}
.sheet label{font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:5px}
.sheet input[type=text],.sheet textarea{
  width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--bg);
}
.sheet textarea{resize:vertical; min-height:140px; line-height:1.4}
.sheet .actions{display:flex; gap:10px; justify-content:flex-end; align-items:center}
.btn-primary{padding:11px 20px; border-radius:12px; background:var(--brand); color:#fff; font-weight:700}
.btn-ghost{padding:11px 16px; border-radius:12px; background:var(--surface2); font-weight:600; color:var(--muted)}
.btn-danger-ghost{padding:11px 16px; border-radius:12px; background:var(--danger-soft); font-weight:600; color:var(--danger)}
.mic-inline{display:flex; align-items:center; gap:8px}

.alert-item{border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.alert-item .obra-tag{font-size:12px; font-weight:700; color:var(--brand-deep); text-transform:uppercase; letter-spacing:.05em}
.hist-item{display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:14px}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px; height:8px; border-radius:50%; background:var(--brand); margin-top:7px; flex:none}
.hist-body{flex:1; min-width:0}
.hist-body .who{font-weight:700}
.hist-meta{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.team-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.team-row:last-child{border-bottom:none}
.team-row span{flex:1; font-weight:600}
.team-row .rm{color:var(--danger); font-size:13px; font-weight:600}

.toast{
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:80;
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:12px; font-weight:600;
  font-size:14px; box-shadow:var(--shadow); max-width:90vw; text-align:center;
}
.offline{padding:60px 24px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:12px; align-items:center}
.offline h2{color:var(--ink)}
.online-banner{display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--brand); border-radius:14px; background:var(--brand-soft); color:var(--brand-deep); font-weight:600; font-size:14px}
.online-dot{width:9px; height:9px; border-radius:50%; background:var(--brand); flex:none; animation:online-pulse 1.6s infinite}
@keyframes online-pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,158,91,.45)}50%{box-shadow:0 0 0 6px rgba(46,158,91,0)}}
.chip.online{background:var(--brand-soft); color:var(--brand-deep); display:inline-flex; align-items:center; gap:6px}
.chip.online::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--brand)}
</style>
</head>

<script>
(function(){
"use strict";
// ---------- state ----------
const SB_URL = "https://aunvnieogltonxdavvpz.supabase.co";
const SB_KEY = "sb_publishable_7G6GychJDCCbk7oAna-GdA_r2Api4sE";
const S = {

  obraId:null,

const $ = id => document.getElementById(id);

// ---------- helpers ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(n){ return String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function fmtFecha(iso){
  if(!iso) return "";
  const d = new Date(iso), hoy = new Date();
  const hm = d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  const sameDay = (a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  if(sameDay(d,hoy)) return "hoy " + hm;
  const ayer = new Date(hoy); ayer.setDate(hoy.getDate()-1);
  if(sameDay(d,ayer)) return "ayer " + hm;
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year: d.getFullYear()===hoy.getFullYear()?undefined:"numeric"}) + " " + hm;
}
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function parseMenciones(texto){
  const t = texto.toLowerCase();
  return S.equipo.filter(n => n!==S.me && t.includes("@"+n.toLowerCase()));
}
function renderTexto(texto){
  let html = esc(texto);
  for(const n of S.equipo){
    const re = new RegExp("@"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    html = html.replace(re, m=>'<span class="mention">'+m+'</span>');
  }
  return html;
}
function itemsDe(obraId){ return [...S.items.values()].filter(i=>i.obraId===obraId); }
function pendientesDe(obraId){ return itemsDe(obraId).filter(i=>i.tipo==="tarea" && i.estado!=="resuelta"); }
function unreadMentions(){
  if(!S.me) return [];
  return [...S.items.entries()]
    .filter(([id,i]) => (i.menciones||[]).includes(S.me) && !(i.vistoPor||[]).includes(S.me) && i.autor!==S.me)
    .map(([id,i]) => ({id, ...i}))
    .sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
}

// ---------- voz ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null, activeMicBtn = null;
function stopMic(){
  if(activeRec){ try{activeRec.stop();}catch(e){} activeRec=null; }
  if(activeMicBtn){ activeMicBtn.classList.remove("rec"); activeMicBtn=null; }
}
function toggleMic(btn, ta){
  if(!SR){ toast("El dictado por voz no está disponible en este navegador. Probá con Chrome."); return; }
  if(activeMicBtn===btn){ stopMic(); return; }
  stopMic();
  const rec = new SR();
  rec.lang = "es-AR"; rec.continuous = true; rec.interimResults = false;
  rec.onresult = ev => {
    let add = "";
    for(let i=ev.resultIndex; i<ev.results.length; i++){
      if(ev.results[i].isFinal) add += ev.results[i][0].transcript;
    }
    if(add){
      ta.value = (ta.value ? ta.value.replace(/\s+$/,"")+" " : "") + add.trim();
      ta.dispatchEvent(new Event("input"));
    }
  };
  rec.onerror = ev => {
    if(ev.error==="not-allowed") toast("Permití el acceso al micrófono para dictar.");
    stopMic();
  };
  rec.onend = ()=>{ if(activeRec===rec) stopMic(); };
  try{ rec.start(); activeRec=rec; activeMicBtn=btn; btn.classList.add("rec"); }
  catch(e){ toast("No se pudo iniciar el micrófono."); }
}

// ---------- capa de datos (Supabase REST) ----------
async function api(path, opts){
  opts = opts||{};
  const r = await fetch(SB_URL+"/rest/v1/"+path, {
    method: opts.method||"GET",
    headers: Object.assign({
      "apikey": SB_KEY, "Authorization": "Bearer "+SB_KEY,
      "Content-Type": "application/json",
      "Prefer": "resolution=merge-duplicates,return=minimal"
    }, opts.headers||{}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!r.ok) throw new Error("api "+r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const itemFromRow = r => ({
  obraId:r.obra_id, tipo:r.tipo, texto:r.texto, autor:r.autor, fecha:r.fecha,
  estado:r.estado, responsable:r.responsable, parentId:r.parent_id,
  resueltaPor:r.resuelta_por, resueltaFecha:r.resuelta_fecha,
  menciones:r.menciones||[], vistoPor:r.visto_por||[], fotos:(r.fotos&&r.fotos.length)?r.fotos:undefined
});
const obraFromRow = r => ({
  nombre:r.nombre, cliente:r.cliente, estado:r.estado, minuta:r.minuta,
  minutaFecha:r.minuta_fecha, minutaPor:r.minuta_por, creada:r.creada, creadaPor:r.creada_por
});
let cargando = false;
async function cargarTodo(){
  if(cargando) return; cargando = true;
  try{
    const [eq, ob, it, pr] = await Promise.all([
      api("equipo?select=nombre&order=nombre"),
      api("obras?select=*"),
      api("items?select=*"),
      api("presencia?select=*")
    ]);
    S.equipo = eq.map(x=>x.nombre);
    S.obras = new Map(ob.map(r=>[r.id, obraFromRow(r)]));
    S.items = new Map(it.map(r=>[r.id, itemFromRow(r)]));
    S.presencia = pr;
    buildRespSel();
    updateHeader();
    if($("mentionBar").classList.contains("open")) buildMentionBar();
    // no re-dibujar mientras se escribe en un hilo
    const ae = document.activeElement;
    const escribiendo = ae && ae.dataset && ae.dataset.tinput;
    if((S.view==="home"||S.view==="obra") && !escribiendo){
      if(S.view==="obra" && !S.obras.has(S.obraId)) setView("home");
      else render();
    }
    maybeAutoAlert();
  }catch(e){
    if(S.view==="loading") setView("offline");
  }finally{ cargando = false; }
}
function enLinea(obraId){
  const limite = Date.now() - 75000;
  return S.presencia.filter(p =>
    p.usuario!==S.me && p.obra_id===obraId && p.visto && Date.parse(p.visto) > limite
  ).map(p=>p.usuario);
}
function latido(){
  if(!S.me) return;
  api("presencia", {method:"POST", body:[{usuario:S.me, obra_id: S.view==="obra" ? (S.obraId||"") : "", visto: nowISO()}]}).catch(()=>{});
}
function logEvento(obraId, accion, detalle){
  api("eventos", {method:"POST", body:[{id:uid(), obra_id:obraId, accion, detalle:detalle||"", autor:S.me, fecha:nowISO()}]}).catch(()=>{});
}
async function guardarEquipo(miembros){
  const actuales = new Set(S.equipo);
  const nuevos = miembros.filter(n=>!actuales.has(n));
  const quitados = S.equipo.filter(n=>!miembros.includes(n));
  if(nuevos.length) await api("equipo", {method:"POST", body:nuevos.map(n=>({nombre:n}))});
  for(const n of quitados) await api("equipo?nombre=eq."+encodeURIComponent(n), {method:"DELETE"});
  S.equipo = miembros.slice();
}
async function crearObra(nombre, cliente){
  const id = uid();
  await api("obras", {method:"POST", body:[{id, nombre, cliente:cliente||"", estado:"activa", minuta:"", creada:nowISO(), creada_por:S.me, minuta_fecha:"", minuta_por:""}]});
  S.obras.set(id, {nombre, cliente:cliente||"", estado:"activa", minuta:"", creada:nowISO(), creadaPor:S.me, minutaFecha:"", minutaPor:""});
  logEvento(id, "creó la obra", nombre);
  return id;
}
async function agregarItem(obraId, tipo, texto, responsable, parentId, fotosDataUrls){
  const menciones = parseMenciones(texto);
  if(tipo==="tarea" && responsable && !menciones.includes(responsable) && responsable!==S.me) menciones.push(responsable);
  let fotoIds = [];
  if(fotosDataUrls && fotosDataUrls.length){
    const filas = fotosDataUrls.map(d=>{ const fid = uid(); S.fotoCache.set(fid,d); return {id:fid, obra_id:obraId, autor:S.me, fecha:nowISO(), data:d}; });
    await api("fotos", {method:"POST", body:filas});
    fotoIds = filas.map(f=>f.id);
  }
  const id = uid();
  const fila = {
    id, obra_id:obraId, tipo, texto, autor:S.me, fecha:nowISO(),
    estado: tipo==="tarea" ? "pendiente" : "",
    responsable: tipo==="tarea" ? (responsable||"") : "",
    parent_id: parentId||"", resuelta_por:"", resuelta_fecha:"",
    menciones, visto_por:[S.me], fotos:fotoIds
  };
  await api("items", {method:"POST", body:[fila]});
  S.items.set(id, itemFromRow(fila));
  const resumen = (texto.length>60 ? texto.slice(0,60)+"…" : texto) + (fotoIds.length ? " 📷×"+fotoIds.length : "");
  logEvento(obraId, tipo==="tarea" ? "cargó una tarea" : (parentId?"comentó una tarea":"dejó un comentario"), resumen);
}
// comprimir foto a JPEG chico para que entre en un documento de la base
function comprimirFoto(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=> reject(new Error("lectura"));
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const intentos = [[1280,.72],[1024,.6],[800,.5],[640,.4]];
          for(const [maxDim,q] of intentos){
            const sc = Math.min(1, maxDim/Math.max(img.width,img.height));
            const w = Math.max(1,Math.round(img.width*sc)), h = Math.max(1,Math.round(img.height*sc));
            const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
            cv.getContext("2d").drawImage(img,0,0,w,h);
            const dataUrl = cv.toDataURL("image/jpeg", q);
            if(dataUrl.length < 200000){ resolve(dataUrl); return; }
          }
          reject(new Error("grande"));
        }catch(e){ reject(e); }
      };
      img.onerror = ()=> reject(new Error("formato"));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function cargarFoto(fid){
  if(S.fotoCache.has(fid)) return S.fotoCache.get(fid);
  try{
    const rows = await api("fotos?id=eq."+encodeURIComponent(fid)+"&select=data");
    if(rows && rows[0]){ S.fotoCache.set(fid, rows[0].data); return rows[0].data; }
  }catch(e){}
  return null;
}
function hidratarFotos(root){
  (root||main).querySelectorAll("img[data-foto]").forEach(img=>{
    const fid = img.dataset.foto;
    if(S.fotoCache.has(fid)){ img.src = S.fotoCache.get(fid); return; }
    cargarFoto(fid).then(d=>{ if(d && img.isConnected) img.src = d; });
  });
}
function abrirLightbox(src){
  const lb = document.createElement("div");
  lb.className = "lightbox";
  const im = document.createElement("img"); im.src = src; lb.appendChild(im);
  lb.onclick = ()=> lb.remove();
  document.body.appendChild(lb);
}
function fotosHTML(it){
  if(!it.fotos || !it.fotos.length) return "";
  return '<div class="item-fotos">'+it.fotos.map(f=>'<img data-foto="'+esc(f)+'" alt="Foto adjunta" loading="lazy">').join("")+'</div>';
}
async function toggleTarea(id){
  const it = S.items.get(id); if(!it) return;
  const resolver = it.estado!=="resuelta";
  const cambio = resolver
    ? {estado:"resuelta", resuelta_por:S.me, resuelta_fecha:nowISO()}
    : {estado:"pendiente", resuelta_por:"", resuelta_fecha:""};
  await api("items?id=eq."+encodeURIComponent(id), {method:"PATCH", body:cambio});
  Object.assign(it, {estado:cambio.estado, resueltaPor:cambio.resuelta_por, resueltaFecha:cambio.resuelta_fecha});
  render();
  const resumen = it.texto.length>60 ? it.texto.slice(0,60)+"…" : it.texto;
  logEvento(it.obraId, resolver ? "marcó como resuelta" : "reabrió la tarea", resumen);
}
async function guardarMinuta(obraId, texto){
  await api("obras?id=eq."+encodeURIComponent(obraId), {method:"PATCH", body:{minuta:texto, minuta_fecha:nowISO(), minuta_por:S.me}});
  const o = S.obras.get(obraId);
  if(o){ o.minuta=texto; o.minutaFecha=nowISO(); o.minutaPor=S.me; render(); }
  logEvento(obraId, "actualizó la minuta", "");
}
async function cambiarEstadoObra(obraId, estado){
  await api("obras?id=eq."+encodeURIComponent(obraId), {method:"PATCH", body:{estado}});
  const o = S.obras.get(obraId); if(o) o.estado = estado;
  logEvento(obraId, estado==="finalizada" ? "finalizó la obra" : "reactivó la obra", "");
}
async function marcarVistas(lista){
  for(const m of lista){
    const cur = S.items.get(m.id); if(!cur) continue;
    const vp = [...(cur.vistoPor||[])];
    if(!vp.includes(S.me)) vp.push(S.me);
    try{
      await api("items?id=eq."+encodeURIComponent(m.id), {method:"PATCH", body:{visto_por:vp}});
      cur.vistoPor = vp;
    }catch(e){}
  }
  updateHeader();
  if(S.view==="home") render();
}

// ---------- render: shell ----------
function setView(view, obraId){
  S.view = view; if(obraId!==undefined) S.obraId = obraId;
  stopMic();
  $("topbar").hidden = (view==="loading"||view==="offline"||view==="setup");
  composer.hidden = !(view==="obra" && obraActual() && obraActual().estado==="activa");
  main.className = composer.hidden ? "" : "has-composer";
  render();
  if(S.me && typeof latido==="function") latido();
}
function obraActual(){ return S.obraId ? S.obras.get(S.obraId) : null; }

function render(){
  updateHeader();
  if(S.view==="loading"){ main.innerHTML = '<div class="offline"><p>Cargando…</p></div>'; return; }
  if(S.view==="offline"){ renderOffline(); return; }
  if(S.view==="setup"){ renderSetup(); return; }

function obraCardHTML(id,o,inner){
  const pend = pendientesDe(id).length;

  return '<div class="'+(inner?'':'card ')+'obra-card" data-obra="'+id+'" role="button" tabindex="0"'+(inner?' style="border-top:1px solid var(--line)"':'')+'>'
    + '<div class="row1"><h3>'+esc(o.nombre)+'</h3>'+(o.cliente?'<span class="cliente">'+esc(o.cliente)+'</span>':'')+'</div>'
    + '<div class="chips">'

       : (pend>0 ? '<span class="chip pend">'+pend+' pendiente'+(pend===1?'':'s')+'</span>' : '<span class="chip ok">Al día</span>'))
    + (conectados.length ? '<span class="chip online">'+esc(conectados.join(", "))+' ahora</span>' : '')
    + (ult ? '<span class="chip">Últ. movimiento: '+fmtFecha(ult)+'</span>' : '')
    + '</div></div>';

    btn.onclick = ()=>{
      const id = btn.dataset.tsend;
      const inp = main.querySelector('[data-tinput="'+id+'"]');

    };
  });
  main.querySelectorAll("[data-tinput]").forEach(inp=>{
    if(draft[inp.dataset.tinput]) inp.value = draft[inp.dataset.tinput];
    inp.addEventListener("keydown", e=>{
      if(e.key==="Enter"){ e.preventDefault(); main.querySelector('[data-tsend="'+inp.dataset.tinput+'"]').click(); }

  });
  hidratarFotos(main);
  main.querySelectorAll(".item-fotos img").forEach(img=>{
    img.onclick = ()=>{ if(img.src) abrirLightbox(img.src); };
  });
}
function tareaHTML(t, its, done){
  const id = [...S.items.entries()].find(([k,v])=>v===t)[0];
  const hilo = its.filter(i=>i.parentId===id).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const open = S.expanded.has(id);
  let h = '<div class="item'+(done?' done-item':'')+'">'
    + '<button class="checkbox'+(done?' done':'')+'" data-toggle="'+id+'" aria-label="'+(done?'Reabrir tarea':'Marcar como resuelta')+'">'
    + (done?'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>':'')
    + '</button>'
    + '<div class="item-body">'
    + '<div class="item-text">'+renderTexto(t.texto)+'</div>'
    + fotosHTML(t)
    + '<div class="item-meta">'
    + (t.responsable?'<span class="resp">'+esc(t.responsable)+'</span>':'')
    + '<span>'+esc(t.autor)+' · '+fmtFecha(t.fecha)+'</span>'
    + (done && t.resueltaPor?'<span>✓ '+esc(t.resueltaPor)+' '+fmtFecha(t.resueltaFecha)+'</span>':'')
    + '</div>'
    + '<button class="thread-toggle" data-thread="'+id+'">'+(open?'Ocultar comentarios':'Comentarios ('+hilo.length+')')+'</button>';
  if(open){
    h += '<div class="thread">';
    for(const c of hilo){
      h += '<div class="titem"><div class="item-text">'+renderTexto(c.texto)+'</div>'
         + '<div class="item-meta">'+esc(c.autor)+' · '+fmtFecha(c.fecha)+'</div></div>';
    }
    h += '<div class="thread-input"><input type="text" data-tinput="'+id+'" placeholder="Comentar esta tarea… (@nombre para mencionar)"><button data-tsend="'+id+'">Enviar</button></div>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}
function comentarioHTML(c){
  return '<div class="item"><div class="item-body">'
    + (c.texto?'<div class="item-text">'+renderTexto(c.texto)+'</div>':'')
    + fotosHTML(c)
    + '<div class="item-meta"><span><strong>'+esc(c.autor)+'</strong> · '+fmtFecha(c.fecha)+'</span></div>'
    + '</div></div>';
}

// ---------- contactos de obra ----------
const ROLES = ["Arquitecto/a","Encargado/a de obra","Electricista","Plomero/a","Gasista","Calefaccionista","Riego","Albañil","Pintor/a","Carpintero/a","Herrero/a","Durlock/Yesería","Redes e Internet","Seguridad/Alarmas","Cliente","Proveedor","Otro"];
function telLink(t){ return "tel:" + t.replace(/[^\d+]/g,""); }
function waLink(t){
  let d = t.replace(/\D/g,"");
  if(d.startsWith("0")) d = d.slice(1);
  if(!d.startsWith("54")) d = "549" + d;
  return "https://wa.me/" + d;
}
const ASPECTOS = [["paciencia","Paciencia"],["agilidad","Agilidad"],["diseno","Diseño"],["comunicacion","Comunicación"],["precio","Precio"]];
let ctRows = [], ctExpandido = new Set();
function promedioCalif(c){
  const cal = c.calificacion || {};
  const vals = ASPECTOS.map(a=>cal[a[0]]).filter(v=>v>0);
  return vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0;
}
function estrellasFijas(valor){
  let h = '<span style="letter-spacing:1px">';
  for(let n=1; n<=5; n++) h += '<span style="color:'+(n<=Math.round(valor)?'var(--amber)':'var(--line)')+'">★</span>';
  return h + '</span>';
}
function aspectosHTML(c){
  const cal = c.calificacion || {};
  return '<div style="display:flex; flex-direction:column; gap:2px; margin-top:6px">'
    + ASPECTOS.map(a=>{
        let stars = '';
        for(let n=1; n<=5; n++){
          stars += '<button data-ctid="'+esc(c.id)+'" data-asp="'+a[0]+'" data-star="'+n+'" aria-label="'+esc(a[1])+': '+n+' estrellas" style="font-size:17px; padding:1px 2px; color:'+(n<=(cal[a[0]]||0)?'var(--amber)':'var(--line)')+'">★</button>';
        }
        return '<div style="display:flex; align-items:center; gap:8px"><span class="meta" style="width:100px">'+esc(a[1])+'</span>'+stars+'</div>';
      }).join("")
    + '</div>';
}

async function cargarContactos(){
  const list = $("ctList"); if(!list) return;
  try{
    ctRows = await api("contactos?obra_id=eq."+encodeURIComponent(S.obraId)+"&order=rol,nombre");
    renderCtList();
  }catch(e){ list.textContent = "No se pudieron cargar los contactos."; }
}
function renderCtList(){
  const list = $("ctList"); if(!list) return;
  if(!ctRows.length){ list.className="meta"; list.textContent = "Sin contactos todavía. Cargá el primero acá abajo."; return; }
  list.className = "";
  list.innerHTML = ctRows.map(c=>{
    const prom = promedioCalif(c);
    const abierto = ctExpandido.has(c.id);
    return '<div class="team-row" style="align-items:flex-start">'
      + '<span class="avatar" style="margin-top:2px">'+esc(initials(c.nombre))+'</span>'
      + '<span style="flex:1; min-width:0; font-weight:400">'
      + '<strong>'+esc(c.nombre)+'</strong> <span class="chip" style="font-size:11px">'+esc(c.rol)+'</span><br>'
      + (prom>0 ? estrellasFijas(prom)+' <span class="meta">'+prom.toFixed(1)+'</span>' : '<span class="meta">Sin calificar</span>')
      + ' <button class="thread-toggle" data-ctcal="'+esc(c.id)+'" style="display:inline">'+(abierto?'Cerrar':'Calificar')+'</button>'
      + (abierto ? aspectosHTML(c) : '')
      + (c.telefono ? '<br><span class="meta" style="font-variant-numeric:tabular-nums">'+esc(c.telefono)+'</span> '
        + '<a href="'+esc(telLink(c.telefono))+'" style="text-decoration:none; margin-left:6px" aria-label="Llamar">📞</a> '
        + '<a href="'+esc(waLink(c.telefono))+'" target="_blank" rel="noopener" style="text-decoration:none; margin-left:4px" aria-label="WhatsApp">💬</a>' : '')
      + (c.notas ? '<br><span class="meta">'+esc(c.notas)+'</span>' : '')
      + '</span>'
      + '<button class="rm" data-ctrm="'+esc(c.id)+'" data-ctnom="'+esc(c.nombre)+'">Quitar</button>'
      + '</div>';
  }).join("");
  list.querySelectorAll("[data-ctcal]").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.ctcal;
      if(ctExpandido.has(id)) ctExpandido.delete(id); else ctExpandido.add(id);
      renderCtList();
    };
  });
  list.querySelectorAll("[data-star]").forEach(b=>{
    b.onclick = async ()=>{
      const c = ctRows.find(x=>x.id===b.dataset.ctid); if(!c) return;
      const cal = Object.assign({}, c.calificacion||{});
      cal[b.dataset.asp] = Number(b.dataset.star);
      try{
        await api("contactos?id=eq."+encodeURIComponent(c.id), {method:"PATCH", body:{calificacion:cal}});
        c.calificacion = cal;
        renderCtList();
      }catch(e){ toast("No se pudo calificar."); }
    };
  });
  list.querySelectorAll("[data-ctrm]").forEach(b=>{
    b.onclick = ()=> openConfirm("¿Quitar a "+b.dataset.ctnom+"?","Se borra de los contactos de esta obra.", async ()=>{
      try{
        await api("contactos?id=eq."+encodeURIComponent(b.dataset.ctrm), {method:"DELETE"});
        logEvento(S.obraId, "quitó un contacto", b.dataset.ctnom);
      }catch(e){ toast("No se pudo quitar."); }
      openContactos();
    });
  });
}

              + (c.telefono?" · "+esc(c.telefono):"")
              + (prom>0?" · ★ "+prom.toFixed(1):"")
              + (c.notas?"<br><small>"+esc(c.notas)+"</small>":"")+"</p></li>";
          }).join("")
        + "</ul>";
      docFinal = doc.replace("<footer>", sec + "<footer>");
    }
  }catch(e){}
  const fecha = new Date().toISOString().slice(0,10);
  try{
    const blob = new Blob([docFinal], {type:"text/html;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Minuta "+o.nombre.replace(/[\\/:*?"<>|]/g,"-")+" "+fecha+".html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast("Minuta exportada.");
  }catch(e){ toast("No se pudo exportar la minuta."); }
}

// ---------- header events ----------
$("bellBtn").onclick = openAlertas;
$("userBtn").onclick = openEquipo;
$("logoHome").onclick = ()=>{ if(S.me) setView("home"); };
$("logoHome").addEventListener("keydown", e=>{ if(e.key==="Enter"&&S.me) setView("home"); });

// ---------- icon path const (reused in export) ----------
const ICON_D = document.querySelector("#logoHome .lg-icon").getAttribute("d");

// ---------- boot ----------
setView("loading");
(async function boot(){
  try{
    await cargarTodo();
  }catch(e){ setView("offline"); return; }
  if(S.view==="offline") return;

  const saved = lsGet("eira_user");
  if(saved && S.equipo.includes(saved)){
    S.me = saved; setView("home"); maybeAutoAlert();
  } else {
    setView("setup");
  }
  latido();
  setInterval(cargarTodo, 12000);
  setInterval(latido, 30000);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible"){ cargarTodo(); latido(); }
  });
})();
})();
</script>
